services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "0.0.0.0:5678:5678"      # escucha en todas las interfaces
    environment:
      - N8N_HOST=ztrack.app
      - N8N_PORT=443
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n/            # subpath clave
      - WEBHOOK_URL=https://ztrack.app/n8n/
      - N8N_EDITOR_BASE_URL=https://ztrack.app/n8n/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=TelemetriaZgroup2026
      - GENERIC_TIMEZONE=America/Lima
      - TZ=America/Lima
    volumes:
      - ./n8n_data:/home/node/.n8n